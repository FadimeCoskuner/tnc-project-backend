<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310b981'/%3E%3Cpath d='M9 16l5 5 9-10' fill='none' stroke='%230a0a0a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased">
    <div class="flex min-h-dvh">
      <aside id="sidebar" class="sticky top-0 hidden h-dvh w-72 shrink-0 flex-col border-r border-neutral-200/70 bg-white lg:flex">
        <div class="flex items-center gap-3 px-6 py-6">
          <div class="grid size-10 place-items-center rounded-xl bg-linear-to-br from-emerald-500 to-emerald-700 font-mono text-sm font-bold text-white shadow-sm">{ }</div>
          <div>
            <p class="text-lg leading-tight font-extrabold tracking-tight">TaskFlow</p>
            <p class="text-xs text-neutral-500">Görev yönetim paneli</p>
          </div>
        </div>

        <nav id="nav-status" aria-label="Durumlar" class="space-y-1 px-3"></nav>

        <p class="mt-8 mb-2 px-6 text-xs font-bold tracking-wider text-neutral-500 uppercase">Ekip</p>
        <nav id="nav-team" aria-label="Ekip" class="min-h-0 flex-1 space-y-1 overflow-y-auto px-3 pb-6"></nav>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col">
        <header class="sticky top-0 z-20 border-b border-neutral-200/70 bg-white/85 backdrop-blur">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-3 px-4 py-4 sm:px-8 2xl:px-12">
            <div class="grid size-10 place-items-center rounded-xl bg-linear-to-br from-emerald-500 to-emerald-700 font-mono text-sm font-bold text-white shadow-sm lg:hidden">{ }</div>
            <div class="mr-auto min-w-0">
              <h1 class="text-xl leading-tight font-extrabold tracking-tight">
                <span class="lg:hidden">TaskFlow</span>
                <span class="hidden lg:inline">Görevler</span>
              </h1>
              <p id="today" class="text-xs text-neutral-500"></p>
            </div>

            <label class="relative order-last w-full md:order-none md:w-80 xl:w-96">
              <span class="sr-only">Görev ara</span>
              <svg class="pointer-events-none absolute top-1/2 left-3.5 size-4 -translate-y-1/2 text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" /></svg>
              <input id="search" type="search" placeholder="Başlık veya açıklamada ara" class="field pl-10!" />
            </label>

            <button id="new-task" type="button" class="btn btn-primary">+ Yeni görev</button>
          </div>
        </header>

        <div class="flex-1 space-y-6 px-4 py-6 sm:px-8 2xl:px-12">
          <section id="stats" aria-label="Özet" class="grid grid-cols-2 gap-4 xl:grid-cols-4"></section>

          <section aria-label="Filtreler" class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <h2 class="flex items-center gap-2 text-base font-bold">
              <span id="list-title">Tüm görevler</span>
              <span id="list-count" class="rounded-full bg-neutral-200/70 px-2 py-0.5 text-xs font-semibold text-neutral-700 tabular-nums">0</span>
            </h2>
            <div class="grid grid-cols-2 gap-3 lg:flex">
              <label class="lg:hidden">
                <span class="sr-only">Durum</span>
                <select id="filter-status" class="field">
                  <option value="">Tüm durumlar</option>
                  <option value="pending">Bekliyor</option>
                  <option value="in-progress">Devam ediyor</option>
                  <option value="completed">Tamamlandı</option>
                </select>
              </label>
              <label class="lg:hidden">
                <span class="sr-only">Atanan kişi</span>
                <select id="filter-assignee" class="field">
                  <option value="">Tüm kişiler</option>
                </select>
              </label>
              <label>
                <span class="sr-only">Öncelik</span>
                <select id="filter-priority" class="field lg:w-44">
                  <option value="">Tüm öncelikler</option>
                  <option value="high">Yüksek</option>
                  <option value="medium">Orta</option>
                  <option value="low">Düşük</option>
                </select>
              </label>
              <label>
                <span class="sr-only">Sıralama</span>
                <select id="sort" class="field lg:w-44">
                  <option value="-createdAt">En yeni</option>
                  <option value="createdAt">En eski</option>
                  <option value="-priority">Öncelik yüksek</option>
                  <option value="priority">Öncelik düşük</option>
                  <option value="title">Başlık A-Z</option>
                </select>
              </label>
            </div>
          </section>

          <main id="task-list" class="grid grid-cols-[repeat(auto-fill,minmax(min(100%,19rem),1fr))] gap-4"></main>

          <nav id="pagination" aria-label="Sayfalama" class="flex items-center justify-between gap-3"></nav>
        </div>
      </div>
    </div>

    <dialog id="task-dialog" class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-3xl border border-neutral-200 bg-white p-0 text-neutral-900 shadow-2xl backdrop:bg-neutral-900/40 backdrop:backdrop-blur-sm">
      <form id="task-form" class="space-y-4 p-7">
        <h2 id="dialog-title" class="text-xl font-extrabold tracking-tight"></h2>
        <label class="block">
          <span class="label">Başlık</span>
          <input name="title" required maxlength="200" class="field" />
        </label>
        <label class="block">
          <span class="label">Açıklama</span>
          <textarea name="description" rows="3" maxlength="2000" class="field resize-y"></textarea>
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <span class="label">Durum</span>
            <select name="status" class="field">
              <option value="pending">Bekliyor</option>
              <option value="in-progress">Devam ediyor</option>
              <option value="completed">Tamamlandı</option>
            </select>
          </label>
          <label class="block">
            <span class="label">Öncelik</span>
            <select name="priority" class="field">
              <option value="low">Düşük</option>
              <option value="medium">Orta</option>
              <option value="high">Yüksek</option>
            </select>
          </label>
        </div>
        <label class="block">
          <span class="label">Atanan kişi</span>
          <input name="assignee" maxlength="100" placeholder="Boş bırakılabilir" class="field" />
        </label>
        <p id="form-error" role="alert" class="hidden rounded-xl bg-red-50 px-3.5 py-2.5 text-sm text-red-700"></p>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" data-close class="btn btn-ghost">Vazgeç</button>
          <button id="form-submit" type="submit" class="btn btn-primary">Kaydet</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="m-auto w-[calc(100%-2rem)] max-w-sm rounded-3xl border border-neutral-200 bg-white p-0 text-neutral-900 shadow-2xl backdrop:bg-neutral-900/40 backdrop:backdrop-blur-sm">
      <div class="p-7">
        <h2 class="text-xl font-extrabold tracking-tight">Görev silinsin mi?</h2>
        <p id="delete-text" class="mt-2 text-sm break-words text-neutral-600"></p>
        <div class="mt-6 flex justify-end gap-2">
          <button type="button" data-close class="btn btn-ghost">Vazgeç</button>
          <button id="delete-confirm" type="button" class="btn btn-danger">Sil</button>
        </div>
      </div>
    </dialog>

    <div id="toasts" aria-live="polite" class="fixed inset-x-4 bottom-4 z-50 flex flex-col items-center gap-2 sm:inset-x-auto sm:right-6 sm:items-end"></div>
  </body>
</html>
